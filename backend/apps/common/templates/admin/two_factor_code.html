{% extends "admin/login.html" %}

{% block content %}
{% if messages %}
<ul class="messagelist">{% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}</ul>
{% endif %}
<div id="content-main">
  <p>Мы отправили 6-значный код в Telegram. Он действует 5 минут.</p>
  <form method="post" id="login-form">{% csrf_token %}
    <div class="form-row">
      <label for="id_code">Код из Telegram:</label>
      <input type="text" name="code" id="id_code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required autofocus>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <div class="submit-row"><input type="submit" value="Подтвердить"></div>
  </form>
  <p><a href="{{ request.path }}">Войти заново</a></p>
</div>
{% endblock %}
