# Не даёт бесплатному Render усыпить бэкенд: каждые 10 минут дёргает /api/health/.
# Render засыпает после ~15 минут без запросов. Использует тот же секрет BACKEND_URL,
# что и subscription-reminders.yml.
name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "Секрет BACKEND_URL не задан — пропускаем."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 15 --retry-all-errors --max-time 90 \
            "${BACKEND_URL%/}/api/health/"
