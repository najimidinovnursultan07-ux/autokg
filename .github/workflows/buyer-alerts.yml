# Уведомления покупателям в Telegram (@autobuyusers_bot): новые объявления
# по сохранённым поискам и снижение цен. Каждые 30 минут с 08:00 до 23:30 по Бишкеку —
# ночью покупателей не беспокоим, накопленное придёт утром.
# Нужны те же секреты, что для напоминаний: BACKEND_URL и CRON_SECRET.
name: Buyer alerts

on:
  schedule:
    - cron: "*/30 2-17 * * *"
  workflow_dispatch:

concurrency:
  group: buyer-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send alerts
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Секреты BACKEND_URL и CRON_SECRET не заданы — пропускаем."
            exit 0
          fi
          # Бесплатный Render засыпает — даём время проснуться
          curl --fail --silent --show-error --retry 4 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST -H "X-Cron-Secret: $CRON_SECRET" \
            "${BACKEND_URL%/}/api/internal/alerts/run/"
